<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Arena</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="splash">
  <div class="sp-cone"></div>
  <img class="sp-logo" src="logo.svg" alt="">
  <div class="sp-name">Chess<span>Arena</span></div>
</div>

<!-- Контейнер приложения -->
<div id="app">
  
  <!-- ВКЛАДКА 1: ГЛАВНАЯ -->
  <div class="tab-page" id="tab-home">
    <header>
      <div class="brand"><img class="logo" src="logo.svg" alt=""><span class="bt">Chess<span>Arena</span></span></div>
      <div class="header-icons">
        <button class="iconbtn" id="btnGoProfile"><span class="prof-mini" id="homeMiniAvatar">?</span></button>
      </div>
    </header>

    <div class="hero-card">
      <h2>Готов к бою?</h2>
      <p>Сыграй быструю партию прямо сейчас</p>
      <button class="cta" onclick="showTab('play')">Играть</button>
    </div>

    <div class="section-title">Статистика</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon" style="color:var(--st-live)">⚡</div>
        <b id="homeElo">1200</b>
        <span>Рейтинг</span>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🏆</div>
        <b id="homeWins">0</b>
        <span>Побед</span>
      </div>
    </div>
  </div>

  <!-- ВКЛАДКА 2: НОВАЯ ИГРА -->
  <div class="tab-page hidden" id="tab-play">
    <header>
      <h2 style="margin:0;font-size:24px">Новая партия</h2>
    </header>

    <div class="play-options">
      <div class="option-row" id="playModeBtn">
        <span class="opt-icon">👤</span>
        <span class="opt-text" id="playModeText">Против бота</span>
        <span class="opt-arrow">▼</span>
      </div>
      <div class="option-row" id="playSideBtn">
        <span class="opt-icon">⚖️</span>
        <span class="opt-text" id="playSideText">Белые</span>
        <span class="opt-arrow">▼</span>
      </div>
      <div class="option-row" id="playLevelBtn">
        <span class="opt-icon">🎚️</span>
        <span class="opt-text" id="playLevelText">Средний</span>
        <span class="opt-arrow">▼</span>
      </div>
    </div>

    <div class="section-title">Контроль времени</div>
    <div class="seg tc-seg" data-k="tc">
      <button data-v="0">∞</button>
      <button data-v="180+2">3+2</button>
      <button data-v="600+0" class="on">10+0</button>
    </div>

    <button class="cta" id="btnStartGame" style="margin-top:24px;background:var(--st-live);box-shadow:0 4px 0 #248c3f">Начать партию</button>
    
    <button class="cta alt" id="btnInvite" style="margin-top:16px">🤝 Играть с другом (онлайн)</button>
  </div>

  <!-- ВКЛАДКА 3: ПРОФИЛЬ -->
  <div class="tab-page hidden" id="tab-profile">
    <header>
      <h2 style="margin:0;font-size:24px">Профиль</h2>
      <button class="iconbtn" id="btnSettings">⚙️</button>
    </header>

    <div class="prof-header-main" id="profileContent">
      <!-- Данные рендерятся через JS -->
    </div>
  </div>

  <!-- НИЖНЕЕ МЕНЮ -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" data-tab="home">
      <i>🏠</i><span>Главная</span>
    </button>
    <button class="nav-btn" data-tab="play">
      <i>♟️</i><span>Играть</span>
    </button>
    <button class="nav-btn" data-tab="profile">
      <i>👤</i><span>Профиль</span>
    </button>
  </nav>
</div>

<!-- ЭКРАН ИГРЫ (скрывает навигацию) -->
<div id="gameView" class="hidden">
  <header style="padding:0 12px">
    <button class="iconbtn" id="btnCloseGame" style="background:none">←</button>
    <div class="brand" style="font-size:16px">Chess Arena</div>
    <div style="width:44px"></div> <!-- Spacer -->
  </header>
  
  <div class="pbar" id="topBar">
    <div class="who"><span class="chip"></span><span class="nm"></span><span class="time hidden"></span></div>
    <div class="caps"></div>
  </div>
  
  <div id="status"></div>
  <div id="boardWrap"><div id="board"></div></div>
  
  <div class="pbar" id="botBar">
    <div class="who"><span class="chip"></span><span class="nm"></span><span class="time hidden"></span></div>
    <div class="caps"></div>
  </div>
  
  <div id="moves"></div>
  <div class="tools">
    <button id="btnUndo"><i>↩</i>Отмена</button>
    <button id="btnFlip"><i>⇅</i>Повернуть</button>
    <button id="btnResign"><i>⚑</i><span>Сдаться</span></button>
  </div>
</div>

<!-- Оверлеи: Выбор опций, Конец игры, Ожидание, Превращение, История -->
<div class="overlay hidden" id="optSelect">
  <div class="sheet">
    <h2 id="optTitle">Выберите</h2>
    <div id="optList" class="opt-list"></div>
    <button class="cta alt" onclick="closeOpts()">Отмена</button>
  </div>
</div>

<div class="overlay hidden" id="wait">
  <div class="sheet">
    <h2>Ждём соперника</h2>
    <p class="sub" style="margin:0">Отправьте ссылку другу.</p>
    <div class="linkbox" id="waitLink"></div>
    <button class="cta" id="btnWaitShare">Отправить другу</button>
    <button class="cta alt" id="btnWaitCopy">Копировать ссылку</button>
    <button class="cta alt" id="btnWaitClose">Отмена</button>
  </div>
</div>

<div class="overlay hidden" id="promo">
  <div class="sheet"><h2>Превратить пешку</h2><div class="promo" id="promoBtns"></div></div>
</div>

<div class="overlay hidden" id="end">
  <div class="sheet">
    <h2 id="endTitle"></h2>
    <p class="sub" id="endText" style="margin:0"></p>
    <p class="sub" id="endElo" style="margin:8px 0 0"></p>
    <button class="cta" id="btnAgain">Новая партия</button>
    <button class="cta alt" id="btnView">Посмотреть доску</button>
  </div>
</div>

<script src="config.js"></script>
<script src="engine.js"></script>
<script src="bot.js"></script>
<script src="app.js"></script>
<script>
(function(){
  var s=document.getElementById('splash');if(!s)return;
  var t0=Date.now(),done=false;
  function hide(){ if(done)return; done=true; setTimeout(function(){ s.classList.add('out'); setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},450); },Math.max(0,1500-(Date.now()-t0))); }
  if(document.readyState==='complete')hide();else window.addEventListener('load',hide);
  setTimeout(hide,4000);
})();
</script>
</body>
</html>
