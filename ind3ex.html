<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess.tg</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
#histList{margin:12px 0;max-height:50vh;overflow:auto;font-size:15px}
.hi{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:8px;border-radius:12px;background:rgba(127,127,127,.12)}
.hi-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.hi-info span{font-size:12px;opacity:.7}
.hi-info b.win{color:#2e9e4f}
.hi-info b.loss{color:#d64545}
.hi-info b.draw{opacity:.8}
.hi button{flex:none;padding:8px 12px;border:0;border-radius:10px;background:#2aabee;color:#fff;font:inherit;font-size:13px}
.hidden{display:none!important}
.rv{display:flex;gap:8px;padding:8px 12px}
.rv button{flex:1;padding:12px 0;border:0;border-radius:12px;background:rgba(127,127,127,.15);color:inherit;font:inherit;font-size:18px}
.rv button:disabled{opacity:.35}
.rv button.ex{flex:1.6;background:#2aabee;color:#fff;font-size:14px}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">Chess<span>.tg</span></div>
    <button class="iconbtn" id="btnMenu" aria-label="Меню">☰</button>
  </header>
  <div class="pbar" id="topBar"><div class="who"><span class="chip"></span><span class="nm"></span></div><div class="caps"></div></div>
  <div id="status"></div>
  <div id="boardWrap"><div id="board"></div></div>
  <div class="pbar" id="botBar"><div class="who"><span class="chip"></span><span class="nm"></span></div><div class="caps"></div></div>
  <div id="moves"></div>
  <div class="tools">
    <button id="btnUndo"><i>↩</i>Отмена</button>
    <button id="btnFlip"><i>⇅</i>Повернуть</button>
    <button id="btnResign"><i>⚑</i><span>Сдаться</span></button>
    <button id="btnNew"><i>＋</i>Новая</button>
  </div>
  <div class="rv hidden" id="rvBar">
    <button id="rvFirst" aria-label="В начало">⏮</button>
    <button id="rvPrev" aria-label="Назад">◀</button>
    <button id="rvNext" aria-label="Вперёд">▶</button>
    <button id="rvLast" aria-label="В конец">⏭</button>
